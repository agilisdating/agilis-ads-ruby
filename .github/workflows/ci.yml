name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: RuboCop
        run: bundle exec rubocop
      - name: Tests
        run: bundle exec rspec
      - name: Build the gem
        run: gem build agilis-ads.gemspec

  integration:
    name: Test-mode API
    runs-on: ubuntu-latest
    needs: test
    env:
      AGILIS_TEST_API_KEY: ${{ secrets.AGILIS_TEST_API_KEY }}
    steps:
      - name: Check for a Test-mode key
        id: key
        run: |
          if [ -z "$AGILIS_TEST_API_KEY" ]; then
            echo "AGILIS_TEST_API_KEY is not set: skipping the Test-mode run."
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif [[ "$AGILIS_TEST_API_KEY" == pk_live_* ]]; then
            echo "::error::AGILIS_TEST_API_KEY is a Live key. The Test-mode run only uses Test keys."
            exit 1
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - uses: ruby/setup-ruby@v1
        if: steps.key.outputs.present == 'true'
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Test-mode tests
        if: steps.key.outputs.present == 'true'
        env:
          AGILIS_INTEGRATION: "1"
        run: bundle exec rspec spec/integration
